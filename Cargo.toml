[package]
name = "circlechat-client"
version = "0.1.1"
edition = "2024"
description = "CircleChat 桌面客户端（wry WebView 外壳）"
license = "MIT OR Apache-2.0"

[dependencies]
# WebView 外壳
wry = "0.57"
# 窗口 / 事件循环（wry 不再自带窗口层，需要自己引入）
tao = "0.37"

# 本地 JSON 配置
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 系统标准目录（配置目录）
directories = "6"

# 配置窗口：纯 Rust GUI（不依赖 HTML）。
# 关闭默认特性是为了避免引入 wgpu，改用 tiny-skia 软件渲染，编译更快、兼容性更好。
iced = { version = "0.14", default-features = false, features = [
    "tiny-skia",
    "crisp",
    "thread-pool",
    "x11",
    "wayland",
] }
# 站外链接交给系统浏览器 / 默认程序
url = "2.5.8"
opener = "0.8.5"

# 站点身份校验：HTTP 请求 + sha256 签名
ureq = "3.4.2"
sha2 = "0.10"

# 系统通知（给页面 JS 调用的 API）
# Linux/BSD 走 D-Bus，macOS 走 mac-notification-sys，Windows 走 tauri-winrt-notification
notify-rust = "4.18.0"

# 解码内置的 PNG 图标（assets/icon.png）
png = "0.18.1"

# Windows 上给 exe 嵌图标（build.rs 用）。
# 只对 Windows 宿主机生效，Linux/macOS 构建时这个依赖根本不会被拉下来。
[target.'cfg(windows)'.build-dependencies]
tauri-winres = "0.3"
