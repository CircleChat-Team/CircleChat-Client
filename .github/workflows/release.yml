name: Release

# 只在你要发版的时候跑：
#   1. 打 tag 推送      → 正式版（tag 名去掉 v 就是版本号）
#   2. 手动 Run workflow → 可以填一个 commit sha，按 sha 发版（prerelease）
#
# 平时的 push 只走 ci.yml 编译 + 测试，不会产生版本，所以不会堆积产物。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "要构建的 commit sha / 分支 / tag；留空则用当前 HEAD"
        required: false
        default: ""
      prerelease:
        description: "标记为预发布版本"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  meta:
    name: 计算版本号
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
          fetch-depth: 0

      - name: 输出版本信息
        id: meta
        run: |
          sha="$(git rev-parse --short HEAD)"

          if [[ "${{ github.event_name }}" == "push" ]]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
            prerelease=false
          else
            version="${{ github.event.inputs.ref }}"
            [[ -z "$version" ]] && version="$sha"
            tag="sha-$sha"
            prerelease="${{ github.event.inputs.prerelease }}"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "版本：$version  标签：$tag  构建号：$sha"

  linux:
    name: Linux
    needs: meta
    runs-on: ubuntu-22.04 # glibc 版本低一些，兼容性更好
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config rpm libfuse2 \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libdbus-1-dev libxkbcommon-dev squashfs-tools

      - name: 构建
        run: cargo build --release
        env:
          CIRCLECHAT_BUILD: ${{ needs.meta.outputs.sha }}

      - name: 打包 deb / rpm / AppImage
        run: |
          chmod +x packaging/linux/*.sh
          ./packaging/linux/build-deb.sh target/release/circlechat-client "${{ needs.meta.outputs.version }}" dist
          ./packaging/linux/build-rpm.sh target/release/circlechat-client "${{ needs.meta.outputs.version }}" dist
          ./packaging/linux/build-appimage.sh target/release/circlechat-client "${{ needs.meta.outputs.version }}" dist
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  windows:
    name: Windows
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # build.rs 会在这一步把 assets/icon.ico 嵌进 exe
      - name: 构建
        run: cargo build --release
        env:
          CIRCLECHAT_BUILD: ${{ needs.meta.outputs.sha }}

      - name: 打包 zip
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/circlechat-client.exe dist/circlechat-client.exe
          Compress-Archive -Path dist/circlechat-client.exe `
            -DestinationPath "dist/circlechat-${{ needs.meta.outputs.version }}-windows-x86_64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  macos:
    name: macOS
    needs: meta
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: 构建
        run: cargo build --release
        env:
          CIRCLECHAT_BUILD: ${{ needs.meta.outputs.sha }}

      - name: 打 .app 与 .dmg
        run: |
          chmod +x packaging/macos/bundle.sh
          CIRCLECHAT_VERSION="${{ needs.meta.outputs.version }}" \
          CIRCLECHAT_DMG=1 \
          ./packaging/macos/bundle.sh target/release/circlechat-client

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/macos/*.dmg

  release:
    name: 发布
    needs: [meta, linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 列一下要上传的东西
        run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: CircleChat ${{ needs.meta.outputs.version }}
          prerelease: ${{ needs.meta.outputs.prerelease }}
          generate_release_notes: true
          files: dist/*
