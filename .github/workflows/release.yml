# CircleChat 客户端 — 发布 CI
# 触发：推送 v* 标签（如 v1.0.0）；构建四平台并上传产物到对应 GitHub Release。
# 发布前请先在本地确认版本号（pubspec.yaml）与标签一致。

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Release ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-24.04
          - platform: macos
            os: macos-15
          - platform: android
            os: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Accept Xcode license
        if: matrix.platform == 'macos'
        run: sudo xcodebuild -license accept

      - run: flutter pub get

      - name: Build Windows
        if: matrix.platform == 'windows'
        timeout-minutes: 30
        run: flutter build windows --release

      - name: Build Linux
        if: matrix.platform == 'linux'
        timeout-minutes: 30
        run: flutter build linux --release

      - name: Build macOS
        if: matrix.platform == 'macos'
        timeout-minutes: 30
        run: flutter build macos --release

      - name: Build Android APK
        if: matrix.platform == 'android'
        timeout-minutes: 30
        run: flutter build apk --release

      # ---- 打包产物 ----

      - name: Package Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release -DestinationPath CircleChat-Client-windows-x64.zip

      - name: Package Linux
        if: matrix.platform == 'linux'
        run: |
          tar -czf CircleChat-Client-linux-x64.tar.gz -C build/linux/x64/release bundle

      - name: Package macOS
        if: matrix.platform == 'macos'
        run: |
          zip -qr CircleChat-Client-macos.zip build/macos/Build/Products/Release

      - name: Rename Android APK
        if: matrix.platform == 'android'
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk CircleChat-Client-android.apk

      # ---- 上传到 Release ----

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: true
          files: |
            CircleChat-Client-windows-x64.zip
            CircleChat-Client-linux-x64.tar.gz
            CircleChat-Client-macos.zip
            CircleChat-Client-android.apk
